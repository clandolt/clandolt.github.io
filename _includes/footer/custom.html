<script>
  // Responsive nav: hamburger below 768px. Replaces the theme's jQuery
  // greedy-navigation, which measured link widths at runtime.
  (function () {
    var nav = document.getElementById('site-nav');
    var toggle = document.querySelector('[data-nav-toggle]');
    var menu = document.getElementById('site-nav-menu');
    if (!nav || !toggle || !menu) return;

    // marks that JS is live, so the CSS stops falling back to an always-open menu
    nav.classList.add('has-js');

    function setOpen(open) {
      menu.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    }

    toggle.addEventListener('click', function () {
      setOpen(toggle.getAttribute('aria-expanded') !== 'true');
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') setOpen(false);
    });

    // a menu left open while resizing back to desktop would otherwise persist
    window.addEventListener('resize', function () {
      if (window.innerWidth > 768) setOpen(false);
    });
  })();

  (function () {
    var VISIBLE = 5;
    var list = document.querySelector('[data-timeline]');
    var toggle = document.querySelector('[data-timeline-toggle]');
    if (!list || !toggle) return;

    var items = list.querySelectorAll('.timeline__item');
    if (items.length <= VISIBLE) return;

    for (var i = VISIBLE; i < items.length; i++) {
      items[i].classList.add('is-collapsed');
    }

    var hiddenCount = items.length - VISIBLE;
    var collapsedLabel = 'Show ' + hiddenCount + ' earlier updates';

    toggle.textContent = collapsedLabel;
    toggle.setAttribute('aria-expanded', 'false');
    toggle.classList.add('is-visible');

    toggle.addEventListener('click', function () {
      var expanded = list.classList.toggle('is-expanded');
      toggle.setAttribute('aria-expanded', String(expanded));
      toggle.textContent = expanded ? 'Show less' : collapsedLabel;
    });
  })();

  // Copy the BibTeX block on a publication page
  (function () {
    if (!navigator.clipboard) return;

    var buttons = document.querySelectorAll('[data-copy-bibtex]');
    Array.prototype.forEach.call(buttons, function (btn) {
      var code = btn.parentNode.querySelector('code');
      if (!code) return;

      btn.addEventListener('click', function () {
        navigator.clipboard.writeText(code.textContent.trim()).then(function () {
          btn.textContent = 'Copied';
          btn.classList.add('is-copied');
          setTimeout(function () {
            btn.textContent = 'Copy';
            btn.classList.remove('is-copied');
          }, 2000);
        });
      });
    });
  })();
</script>

<!-- end custom footer snippets -->
